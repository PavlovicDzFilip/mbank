name: CI

on:
  push:
  pull_request:
  merge_group:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MBank.slnx

      - name: Lint (format)
        run: dotnet format MBank.slnx --verify-no-changes --verbosity minimal

      - name: Lint (build / analyzers)
        run: dotnet build MBank.slnx -c Release --no-restore

      - name: Test
        run: dotnet test tests/MBank.Tests/MBank.Tests.csproj -c Release --no-restore -p:UseAppHost=false

      - uses: docker/setup-buildx-action@v3

      - name: Build api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/MBank.Api/Dockerfile
          target: api
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build migrate image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/MBank.Api/Dockerfile
          target: migrate
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
