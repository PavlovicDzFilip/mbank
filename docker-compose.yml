services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mbank-postgres
    environment:
      POSTGRES_DB: mbank
      POSTGRES_USER: mbank
      POSTGRES_PASSWORD: mbank
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mbank -d mbank"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

